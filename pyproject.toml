[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvd-risk"
version = "2.0.0.dev0"
description = "Verified, vectorised implementations of cardiovascular risk scores"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT AND LGPL-3.0-or-later"}  # LGPL covers src/cvd_risk/qrisk2 and qrisk3 only
authors = [{name = "Mohamad AlJasem", email = "mohamad@aljasem.eu.org"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.4", "hypothesis>=6.80", "pandas>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/cvd_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
