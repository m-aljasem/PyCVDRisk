<script type="text/javascript" src="../lib/jquery/jquery-3.1.1.min.js"></script>

</head>
<body>
	<div class="headerRoot">
		<div class="main">
			<div class="left">動脈硬化性疾患発症予測・脂質管理目標設定アプリ<br />（医師・医療従事者向け）</div>
			<div class="right">
				<button onClick="javascript:history.back(); return false;">
					<img src="appbar.arrow.left.png" class="backBtnImg">
				</button>
			</div>
		</div>
	</div>
	<div class="contentsRoot">
		<div class="main">
			<p class="questionText bold">下記のいずれかの既往があるか？</p>
			<ul class="questionText bold">
				<li>冠動脈疾患</li>
				<li>アテローム血栓性脳梗塞（明らかなアテローム＊を伴うその他の脳梗塞を含む）<br /><small>*頭蓋内外動脈に50％以上の狭窄、または弓部大動脈粥腫（最大肥厚４mm以上）</small></li>
			</ul>
		</div>
		<br />
		<div class="main center">
			<p>
				<button id="noBtn" class="default">なし</button>
			</p>
			<p>
				<button id="yesBtn">あり</button>
			</p>

	</div>
